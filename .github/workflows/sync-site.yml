name: Publish Hostel Finder

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/sync-site.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish site files
        run: |
          cp site/index.html index.html
          cp site/style.css style.css
          cp site/script.js script.js

      - name: Commit published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css script.js
          git diff --cached --quiet || (git commit -m "Publish travel hostel listings" && git push)
